name: Verify offline game on Apple WebKit
on:
  push:
    branches: [qa/english-offline-webkit]
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test browser
        working-directory: .qa
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install webkit
      - name: Play the three offline builds
        env:
          GAME_DIST: .
          GAME_HTML: .qa/game.html
          GAME_EPUB: .qa/game.epub
          QA_REPORT: qa-results/apple-offline.json
        run: node .qa/apple-offline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-webkit-results
          path: qa-results/apple-offline.json
          if-no-files-found: warn
          retention-days: 7
